<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Market Intelligence</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/assistant.css"><script src="/app.js" defer></script></head>
<body><header><h1>Photo Market Intelligence</h1><nav><button id="notifications-open" type="button">Notifications <span id="notification-count">0</span></button><button id="assistant-open" type="button">Assistant</button><a id="compare-link" href="/compare.html" aria-label="Open comparison">Compare <span id="compare-count">0</span>/4</a></nav></header>
<main><form id="search-form" role="search"><label for="search">Search catalog</label><div class="search-row"><input id="search" name="q" type="search" placeholder="Search cameras, lenses, aliases…"><button>Search</button></div></form>
<section class="summary" aria-label="Summary"><article><strong id="wishlist-count">0</strong><span>Wishlist</span></article><article><strong id="owned-count">0</strong><span>Owned</span></article><article><strong id="decision-count">0</strong><span>Recent decisions</span></article></section>
<details class="filters" open><summary>Filters and sorting</summary><div class="filter-grid"><label>Category<select id="category"><option value="">All</option></select></label><label>Brand<select id="brand"><option value="">All</option></select></label><label>Mount<select id="mount"><option value="">All</option></select></label><label>Ownership<select id="owned"><option value="">All</option><option value="true">Owned</option><option value="false">Not owned</option></select></label><label>Wishlist<select id="wishlist"><option value="">All</option><option value="true">Wishlist</option><option value="false">Not wishlist</option></select></label><label>Market<select id="market"><option value="">Any</option><option value="new">NEW available</option><option value="used">USED available</option></select></label><label>Min confidence<input id="confidence" type="number" min="0" max="100"></label><label>Sort<select id="sort"><option value="relevance">Relevance</option><option value="brand">Brand</option><option value="newest">Newest release</option><option value="used_price">Lowest used median</option><option value="new_price">Lowest new median</option><option value="confidence">Highest confidence</option><option value="wishlist_priority">Wishlist priority</option></select></label></div></details>
<section><h2>Market opportunities</h2><div id="opportunities" class="compact-list"><span>Unavailable in local mode</span></div></section><section><h2>Products</h2><p id="message" role="status"></p><div id="products" class="product-grid"></div></section></main><aside id="notification-panel" class="side-panel" hidden><button id="notifications-close" type="button">Close</button><h2>Notifications</h2><div id="notification-list"></div></aside><aside id="assistant-panel" class="side-panel" hidden><button id="assistant-close" type="button">Close</button><h2>Assistant</h2><form id="assistant-form"><label for="assistant-message">Ask about existing project data</label><textarea id="assistant-message" required></textarea><button>Ask</button></form><div id="assistant-response" role="status"></div></aside></body></html>
